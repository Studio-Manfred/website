name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["**/*.md"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@studio-manfred"

      - name: Install dependencies
        run: npm ci
        env:
          NPM_RC_TOKEN: ${{ secrets.NPM_RC_TOKEN || secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_RC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + component tests
        run: npm run test:coverage

      - name: Coverage ratchet gate
        run: node scripts/coverage-ratchet.mjs

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Build
        run: npm run build

      # Auto-bump of .coverage-baseline.json on main is deferred — it
      # requires `permissions: contents: write`, which appears blocked by
      # org policy on this repo. For now: when coverage genuinely rises,
      # the failing PR check will say which metric improved, and the
      # baseline can be bumped manually with `node scripts/coverage-ratchet.mjs --update`.

  e2e:
    name: Playwright E2E + axe
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@studio-manfred"

      - name: Install dependencies
        run: npm ci
        env:
          NPM_RC_TOKEN: ${{ secrets.NPM_RC_TOKEN || secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_RC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Resolve Playwright version
        id: pw
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Cache Next build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts','**/*.tsx','**/*.css') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-${{ runner.os }}-

      - name: Build
        run: npm run build

      - name: Run Playwright
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Playwright traces + axe attachments
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results
          retention-days: 14
          if-no-files-found: ignore

  bump-baseline:
    name: Auto-bump coverage baseline on main
    runs-on: ubuntu-latest
    needs: [verify, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@studio-manfred"

      - name: Install dependencies
        run: npm ci
        env:
          NPM_RC_TOKEN: ${{ secrets.NPM_RC_TOKEN || secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_RC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Re-run coverage
        run: npm run test:coverage

      - name: Update baseline if coverage rose
        id: ratchet
        run: node scripts/coverage-ratchet.mjs --update

      - name: Commit and push updated baseline
        run: |
          if git diff --quiet -- .coverage-baseline.json; then
            echo "Baseline unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .coverage-baseline.json
          git commit -m "chore(coverage): bump baseline [skip ci]"
          git push origin HEAD:main
