name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["**/*.md"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  packages: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@studio-manfred"

      - name: Install dependencies
        run: npm ci
        env:
          NPM_RC_TOKEN: ${{ secrets.NPM_RC_TOKEN || secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_RC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + component tests
        run: npm run test:coverage

      - name: Coverage ratchet gate
        run: node scripts/coverage-ratchet.mjs

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Build
        run: npm run build

      - name: Bump coverage baseline (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -e
          node scripts/coverage-ratchet.mjs --update
          if ! git diff --quiet -- .coverage-baseline.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .coverage-baseline.json
            git commit -m "chore(coverage): bump baseline [skip ci]"
            git push
          else
            echo "Baseline unchanged."
          fi
