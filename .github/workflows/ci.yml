name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["**/*.md"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@studio-manfred"

      - name: Install dependencies
        run: npm ci
        env:
          NPM_RC_TOKEN: ${{ secrets.NPM_RC_TOKEN || secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_RC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + component tests
        run: npm run test:coverage

      - name: Coverage ratchet gate
        run: node scripts/coverage-ratchet.mjs

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Build
        run: npm run build

      # Auto-bump of .coverage-baseline.json on main is deferred — it
      # requires `permissions: contents: write`, which appears blocked by
      # org policy on this repo. For now: when coverage genuinely rises,
      # the failing PR check will say which metric improved, and the
      # baseline can be bumped manually with `node scripts/coverage-ratchet.mjs --update`.
