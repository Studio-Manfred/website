name: Monthly site audit

# Crawls the live site once a month and posts a Slack message (to the
# channel bound to the SLACK_WEBHOOK_URL secret) when any broken URLs
# are found. Can also be triggered manually from the Actions tab.

on:
  schedule:
    # 08:00 UTC on the 1st of each month (09:00 / 10:00 Stockholm time).
    - cron: "0 8 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: site-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Crawl + alert
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ROOT: https://studiomanfred.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@studio-manfred"

      - name: Install dependencies
        run: npm ci
        env:
          NPM_RC_TOKEN: ${{ secrets.NPM_RC_TOKEN || secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_RC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Resolve Playwright version
        id: pw
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run site audit
        run: node scripts/audit-404.mjs --root="$ROOT" --json > audit-report.json

      - name: Notify Slack on broken URLs
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node scripts/audit-404-notify.mjs audit-report.json

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit-report.json
          retention-days: 90
          if-no-files-found: warn
